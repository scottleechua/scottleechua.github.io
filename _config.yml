---
# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Scott Lee Chua 🇵🇭  # if blank, full name will be used instead
first_name: Scott
middle_name: Lee
last_name: Chua 🇵🇭
email: scottleechua@gmail.com
description: Econs | Comics | Games
keywords:

lang: en
icon:  # the emoji used as the favicon
url: https://scottleechua.com

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: true  # Include Open Graph meta tags in the HTML head
serve_schema_org: false  # Include Schema.org in the HTML head
og_image: profile-picture-lores.jpg  # The sitewide Open Graph preview image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: scottleechua
# gitlab_username:
# twitter_username:
# linkedin_username:
scholar_userid: GJBprlAAAAAJ
# orcid_id:
# medium_username:
# quora_username:
# publons_id:
# research_gate_profile:
# blogger_url:
# work_url:  # work page URL
# keybase_username:
# wikidata_id:
# dblp_url:
# stackoverflow_id:
# mastodon_profile: https://mastodon.social/@scottleechua
s3_url: https://d48rdc2gjiluz.cloudfront.net
bluesky_profile: https://bsky.app/profile/scottleechua.com

contact_note:  # which of these is the best way to reach you?

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_nav_title: blog
permalink: /blog/:title/

# Pagination
pagination:
  enabled: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  comics:
    output: true
    permalink: /comics/:path/
  games:
    output: true
    permalink: /games/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
highlight_theme: github  # https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_light: github
highlight_theme_dark: native
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-email-protect
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-target-blank
  - jekyll-sitemap
  - jekyll-feed

# External link settings (https://github.com/keithmifsud/jekyll-target-blank)
target-blank:
  noreferrer: false

# Sitemap settings
defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name: Chua
  first_name: [Scott, S., S.L.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

# -----------------------------------------------------------------------------
# Jekyll Feed
# -----------------------------------------------------------------------------
author: Scott Lee Chua
feed:
  collections:
    posts:
      path: "/feed/blog.xml"
    news:
      path: "/feed/news.xml"
  excerpt_only: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_goatcounter: true
enable_mastodon_linkback: true
enable_masonry: true
enable_math: true
enable_darkmode: true
enable_navbar_social: false

