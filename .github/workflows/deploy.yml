---
name: Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - source
  schedule:
    - cron: '37 8 1 1 *'  # rebuild on Jan 1 to update copyright year

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: '3.4.12'
        bundler-cache: true
    - name: Build site
      run: |
        bundle exec jekyll build
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        folder: _site
